# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi khi thiếu thông tin bắt buộc. Chỉ gọi tool này trong lượt đó, không gọi tool khác. Dùng response_type=text khi cần asset ID hoặc employee ID. Dùng response_type=choice và options khi giá trị phải thuộc enum nhỏ. Môi trường không rõ: options phải là production và staging."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi để lấy đúng giá trị còn thiếu"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text = mã tự do; choice = chọn từ options; yes_no = xác nhận"}
        options: {type: array, default: [], items: {type: string}, description: "Bắt buộc khi response_type=choice; với môi trường dùng [production, staging]"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Bắt buộc truyền rõ ở mọi lượt gọi, không để trống. Nếu câu hỏi nêu rõ chủ đề, dùng đúng giá trị đó: Outlook/webmail/mail client => email (không phải software); Wi-Fi => wifi; VPN => vpn; máy in => printing; đăng nhập/mật khẩu/khoá tài khoản => account; mã độc/quyền truy cập => security; thiết bị vật lý (pin, ổ cứng) => hardware; cài đặt/ứng dụng nói chung không phải mail client => software; phòng họp => meeting_room. Chỉ dùng 'all' khi câu hỏi chung chung, không thuộc chủ đề cụ thể nào."}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái dịch vụ dùng chung. environment chỉ nhận production hoặc staging. Nếu môi trường thiếu, mơ hồ, hoặc là tên không chính thức, đừng mặc định và đừng gọi tool này — dùng clarify với choice [production, staging]."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Chỉ production hoặc staging. Không map tên không chính thức. Thiếu hoặc mơ hồ thì không gọi tool này."}
      required: [service]

  - name: inspect_device
    description: "Chẩn đoán một thiết bị theo asset ID trong kho. asset_id phải là mã tài sản (ví dụ LT-204, DT-031), không phải loại máy, 'laptop', tên người, hay employee ID. Nếu chưa có mã hợp lệ trong hội thoại, đừng gọi tool này — dùng clarify. Không dùng EMP-ID làm asset_id."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản dạng PREFIX-NUMBER. Không bịa. Không dùng employee ID."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Bắt buộc truyền rõ ở mọi lượt gọi, không để trống. Nếu người dùng nêu rõ subsystem (vpn, network, security, hardware, software), dùng đúng giá trị đó. Chỉ dùng 'all' khi người dùng yêu cầu kiểm tra tổng thể, không nêu subsystem cụ thể."}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu một nhân viên theo employee ID. employee_id phải là mã nhân viên (ví dụ EMP-1003), không phải tên, phòng ban hay nhóm. Kết quả đã gồm thiết bị được cấp; không inspect_device bằng employee ID. Nếu thiếu mã hợp lệ, dùng clarify."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên dạng EMP-.... Không dùng tên hay phòng ban."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Bắt buộc truyền rõ ở mọi lượt gọi, không để trống. Ánh xạ chủ đề: phân loại mức độ/ưu tiên sự cố => incident_response; đăng nhập/quyền truy cập/khoá tài khoản => access_control; dữ liệu cá nhân/riêng tư => data_privacy; công cụ/dịch vụ bên ngoài => external_tools; vận hành/uptime dịch vụ => service_operations; tạo/theo dõi ticket => ticketing. Chỉ dùng 'all' khi câu hỏi chung chung, không thuộc chủ đề cụ thể nào."}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ. Đây là hành động ghi dữ liệu. Không gọi tool này để hỏi xác nhận — dùng clarify(response_type=yes_no) trước, tóm tắt đúng summary/priority/asset_id sẽ tạo. Chỉ gọi create_ticket với confirmed=true sau khi người dùng đã trả lời đồng ý rõ ràng cho đúng payload đó trong lượt trước, hoặc khi chính câu hiện tại của người dùng đã nêu rõ xác nhận (vd 'tôi xác nhận', 'mình xác nhận') cho đúng payload vừa mô tả — khi đó gọi create_ticket(confirmed=true) ngay, không hỏi lại clarify thừa. Nếu summary, priority hoặc asset_id đổi sau khi đã xác nhận, xác nhận cũ hết hiệu lực — phải clarify lại trước khi gọi lại."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Chỉ true khi người dùng đã xác nhận rõ ràng qua clarify(yes_no) cho đúng payload hiện tại; nếu chưa hỏi hoặc payload vừa đổi, không gọi create_ticket ở lượt này"}
      required: [summary]

  - name: check_warranty_status
    description: "Kiểm tra tình trạng bảo hành phần cứng của một thiết bị theo asset_id (tool bonus, tự xây). asset_id phải là mã tài sản (ví dụ LT-204, DT-031), không phải loại máy, tên người hay employee ID. Nếu chưa có mã hợp lệ trong hội thoại, đừng gọi tool này — dùng clarify. Trả về warranty_until, số ngày còn lại và status (in_warranty/expiring_soon/expired)."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản dạng PREFIX-NUMBER. Không bịa. Không dùng employee ID."}
      required: [asset_id]
